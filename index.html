<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storytime Player</title>
    <style>
        /* Audio player control panel */
        body { font-family: Georgia, serif; text-align: center; background: #fdf6e2; color: #333; padding: 40px; }
        .player-container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #8b5a2b; color: white; border: none; padding: 10px 20px; margin: 8px; border-radius: 20px; cursor: pointer; font-size: 16px; }
        button:hover { background: #a06d3b; }
        .btn-back { background: #555; }
        .btn-back:hover { background: #777; }
        h1 { color: #5c3a21; margin-bottom: 5px; }
        h2 { color: #5c3a21; margin-top: 0; }
        .subtitle { color: #8b5a2b; font-style: italic; margin-bottom: 30px; }
        .grid { display: flex; flex-direction: column; gap: 10px; }
        .hidden { display: none; }
        
        /* Ambience control panel */
        .ambiance-panel { margin-top: 25px; padding-top: 15px; border-top: 1px dashed #ccc; }
        .ambiance-title { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .btn-ambient { background: #4a6b5d; font-size: 14px; padding: 8px 15px; }
        .btn-ambient:hover { background: #5c8574; }
        .btn-ambient.active { background: #c2593f; } /* Highlighting the active ambiance */
    </style>
</head>
<body>
    <h1>Storytime Corner</h1>
    <p class="subtitle">Escape into a world of audio adventures</p>

    <div class="player-container">
        <!-- 1. MAIN MENU (STORY SELECTION VIEW) -->
        <div id="story-menu-view">
            <h2>Select a Story</h2>
            <div id="story-list-container" class="grid">
                <!-- Dynamically populated by JS -->
            </div>
        </div>

        <!-- 2. CHAPTER PLAYER VIEW (HIDDEN BY DEFAULT) -->
        <div id="chapter-player-view" class="hidden">
            <button class="btn-back" onclick="showMainMenu()">← Main Menu</button>
            <h2 id="current-story-title" style="margin-top: 15px;">Story Title</h2>
            <h3 id="current-chapter-title" style="font-weight: normal; color: #666;">Select a Chapter</h3>
            
            <audio id="audio-player" controls style="width: 100%; margin: 15px 0;"></audio>

            <div id="chapter-list-container" style="margin-top: 20px;">
                <!-- Dynamically populated by JS -->
            </div>
        </div>

        <!-- 3. BACKGROUND AMBIANCE PANEL (PERMANENTLY VISIBLE AT THE BOTTOM) -->
        <div class="ambiance-panel">
            <div class="ambiance-title">Background Sounds</div>
            <!-- Invisible background audio tag with "loop" enabled -->
            <audio id="ambient-player" loop></audio>
            
            <button class="btn-ambient" id="btn-pink" onclick="toggleAmbiance('audio/ambience/pink_noise.mp3', 'btn-pink')">Pink Noise</button>
            <button class="btn-ambient" id="btn-waves" onclick="toggleAmbiance('audio/ambience/waves.mp3', 'btn-waves')">Waves</button>
            <button class="btn-ambient" id="btn-forest" onclick="toggleAmbiance('audio/ambience/forest.mp3', 'btn-forest')">Forest</button>
        </div>
    </div>

    <script>
        const catalog = [
            {
                id: "lost-pigeon",
                title: "A Lost Pigeon in NYC",
                chapters: [
                    { title: "Chapter 1: The Takeoff", src: "audio/a_lost_pigeon_in_nyc/chapter1.mp3" },
                    { title: "Chapter 2: Central Park", src: "audio/a_lost_pigeon_in_nyc/chapter2.mp3" },
                    { title: "Chapter 3: Safe at Last", src: "audio/a_lost_pigeon_in_nyc/chapter3.mp3" }
                ]
            },
            {
                id: "deep-sea",
                title: "The Deep Sea Submarine",
                chapters: [
                    { title: "Chapter 1: Into the Blue", src: "audio/deep_sea/chapter1.mp3" },
                    { title: "Chapter 2: The Trench", src: "audio/deep_sea/chapter2.mp3" }
                ]
            }
        ];

        // Global DOM Elements
        const storyMenuView = document.getElementById('story-menu-view');
        const chapterPlayerView = document.getElementById('chapter-player-view');
        const storyListContainer = document.getElementById('story-list-container');
        const chapterListContainer = document.getElementById('chapter-list-container');
        const audioPlayer = document.getElementById('audio-player');
        const ambientPlayer = document.getElementById('ambient-player');
        const currentStoryTitle = document.getElementById('current-story-title');
        const currentChapterTitle = document.getElementById('current-chapter-title');

        // Set ambient volume slightly lower so it doesn't drown out the story voiceover
        ambientPlayer.volume = 0.3; 

        function initApp() {
            storyListContainer.innerHTML = '';
            catalog.forEach(story => {
                const btn = document.createElement('button');
                btn.innerText = story.title;
                btn.onclick = () => loadStory(story.id);
                storyListContainer.appendChild(btn);
            });
        }

        function loadStory(storyId) {
            const story = catalog.find(s => s.id === storyId);
            if (!story) return;

            currentStoryTitle.innerText = story.title;
            currentChapterTitle.innerText = "Select a Chapter";
            chapterListContainer.innerHTML = '';

            story.chapters.forEach(chapter => {
                const btn = document.createElement('button');
                btn.innerText = chapter.title.split(':')[0]; 
                btn.onclick = () => playChapter(chapter.src, chapter.title);
                chapterListContainer.appendChild(btn);
            });

            storyMenuView.classList.add('hidden');
            chapterPlayerView.classList.remove('hidden');
        }

        function playChapter(audiosrc, fullTitle) {
            currentChapterTitle.innerText = fullTitle;
            audioPlayer.src = audiosrc;
            audioPlayer.play();
        }

        function showMainMenu() {
            audioPlayer.pause(); 
            chapterPlayerView.classList.add('hidden');
            storyMenuView.classList.remove('hidden');
        }

        // NEW: Handles playing, changing, or stopping background audio tracks
        function toggleAmbiance(src, buttonId) {
            const clickedButton = document.getElementById(buttonId);
            const isCurrentTrack = ambientPlayer.src.includes(src);

            // Clear active styling from all ambient buttons
            document.querySelectorAll('.btn-ambient').forEach(btn => btn.classList.remove('active'));

            if (!ambientPlayer.paused && isCurrentTrack) {
                // Scenario A: User clicked the active sound button -> Turn it off
                ambientPlayer.pause();
            } else {
                // Scenario B: User clicked a brand new track or turned it back on
                ambientPlayer.src = src;
                ambientPlayer.play();
                clickedButton.classList.add('active'); // Turn button red to indicate it is on
            }
        }

        initApp();
    </script>
</body>
</html>
